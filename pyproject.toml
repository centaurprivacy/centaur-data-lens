[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "centaur-data-lens"
version = "0.1.0a1"
description = "Explore personal data disclosed in platform exports, locally and securely"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Centaur Privacy" }]
keywords = ["privacy", "google-takeout", "meta", "data-export", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "ijson>=3.3,<4",
  "pydantic>=2.9,<3",
  "questionary>=2.1,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/centaurprivacy/centaur-data-lens"
Issues = "https://github.com/centaurprivacy/centaur-data-lens/issues"
Source = "https://github.com/centaurprivacy/centaur-data-lens"

[project.scripts]
centaur-data-lens = "centaur_data_lens.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "cyclonedx-bom>=7,<8",
  "hypothesis>=6.125,<7",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/centaur_data_lens"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["centaur_data_lens"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-socket"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["centaur_data_lens"]
omit = ["src/centaur_data_lens/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
